name: Build macOS and Linux Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build macOS app
      run: |
        pyinstaller --onefile --windowed Multipage_App.py \
          --add-data "US_zip_codes.db:." \
          --icon "Meet Other Gamers.icns"

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: macOS-app
        path: dist/*


  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Linux app
      run: |
        pyinstaller --onefile Multipage_App.py \
          --add-data "US_zip_codes.db:."

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-app
        path: dist/*

