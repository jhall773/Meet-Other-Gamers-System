name: Build App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    env:
      MEET_GAMERS_URL: ${{ secrets.MEET_GAMERS_URL }}
      MEET_GAMERS_API_KEY: ${{ secrets.MEET_GAMERS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug env
        run: |
          echo "URL is: $MEET_GAMERS_URL"
          echo "KEY is: $MEET_GAMERS_API_KEY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
  
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
  
      - name: Build macOS App
        run: |
          export MEET_GAMERS_URL="${{ secrets.MEET_GAMERS_URL }}"
          export MEET_GAMERS_API_KEY="${{ secrets.MEET_GAMERS_API_KEY }}"
          pyinstaller --onefile --windowed Multipage_App.py \
            --add-data "US_zip_codes.db:." \
            --icon "Meet Other Gamers.icns"
  
      - name: Create DMG Installer
        run: |
          hdiutil create -volname "Meet Other Gamers" \
            -srcfolder dist/Multipage_App.app \
            -ov -format UDZO MeetOtherGamers.dmg
  
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: MeetOtherGamers.dmg

  build-linux:
    runs-on: ubuntu-latest
    
    env:
      MEET_GAMERS_URL: ${{ secrets.MEET_GAMERS_URL }}
      MEET_GAMERS_API_KEY: ${{ secrets.MEET_GAMERS_API_KEY }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug env
        run: |
          echo "URL is: $MEET_GAMERS_URL"
          echo "KEY is: $MEET_GAMERS_API_KEY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          export MEET_GAMERS_URL="${{ secrets.MEET_GAMERS_URL }}"
          export MEET_GAMERS_API_KEY="${{ secrets.MEET_GAMERS_API_KEY }}"
          pyinstaller --onefile Multipage_App.py \
            --add-data "US_zip_codes.db:."

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-App
          path: dist/Multipage_App
  build-windows:
    runs-on: windows-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
  
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
  
      - name: Build Windows EXE
        run: |
          set MEET_GAMERS_URL=${{ secrets.MEET_GAMERS_URL }}
          set MEET_GAMERS_API_KEY=${{ secrets.MEET_GAMERS_API_KEY }}
          pyinstaller --onefile Multipage_App.py --add-data "US_zip_codes.db;." --icon "Meet Other Gamers.ico"
  
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: dist/Multipage_App.exe

